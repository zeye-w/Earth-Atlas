<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <meta name="description" content="Explore real-time day and night, satellite orbits, weather and surface geology on an interactive 3D Earth." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TerraScope | Digital Earth</title>
    <style>
      /*
       * Loading screen, shown while the 4 MB app bundle downloads (src/splash.ts
       * drives the stages and removes it). No images or fonts: it must not slow
       * the load it covers. The globe is drawn where the real globe will appear
       * in the default view (diameter = 49.1% of the longer side for a 60° field
       * of view from 17,000 km), lit from the real sun, so the 3D Earth takes
       * over in place.
       */
      html, body { margin:0; height:100%; background:#05070b; }
      #splash { --globe:49.1vmax; --sun-angle:0deg; --sun-x:60%; --lit-w:80%; --lit-h:110%;
        position:fixed; inset:0; z-index:100; overflow:hidden; color:#f4f5f7;
        font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        background:
          radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.75), transparent),
          radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,.6), transparent),
          radial-gradient(1.5px 1.5px at 88% 64%, rgba(255,255,255,.7), transparent),
          radial-gradient(1px 1px at 22% 82%, rgba(255,255,255,.55), transparent),
          radial-gradient(1px 1px at 63% 90%, rgba(255,255,255,.5), transparent),
          radial-gradient(1px 1px at 42% 8%, rgba(255,255,255,.55), transparent),
          radial-gradient(1px 1px at 5% 55%, rgba(255,255,255,.5), transparent),
          radial-gradient(1px 1px at 95% 30%, rgba(255,255,255,.5), transparent),
          radial-gradient(ellipse at 50% 50%, #0b1220 0%, #05070b 70%);
        transition:opacity .9s ease, visibility .9s; }
      #splash.done { opacity:0; visibility:hidden; }
      #splash.done .splash-panel { opacity:0; transform:translate(-50%, 8px); }
      .splash-globe { position:absolute; left:50%; top:50%; width:var(--globe); height:var(--globe); transform:translate(-50%, -50%); border-radius:50%;
        /* Night side close to the real globe's, so the handoff does not jump. */
        background:radial-gradient(circle at 50% 50%, #081a2e 0%, #050f1d 70%, #030812 100%);
        box-shadow:0 0 calc(var(--globe) * .05) calc(var(--globe) * .012) rgba(110,170,255,.35), inset 0 0 calc(var(--globe) * .04) rgba(140,200,255,.35); overflow:hidden; }
      /* Day side: an ellipse around the sun's point, rotated towards the sun. */
      .splash-day { position:absolute; inset:0; transform:rotate(var(--sun-angle)); opacity:0; animation:splash-in 1.2s ease .1s forwards;
        background:radial-gradient(ellipse var(--lit-w) var(--lit-h) at var(--sun-x) 50%, #7fb6ec 0%, #3f86c9 32%, #1d5a96 58%, rgba(13,42,72,0) 100%); }
      /* Night side: scattered city lights, masked away from the sun. */
      /* Three sparse dot lattices with co-prime spacings, so no grid shows. */
      .splash-lights { position:absolute; inset:0; transform:rotate(var(--sun-angle)); opacity:.28;
        background:
          radial-gradient(circle, rgba(255,205,120,.9) 0 .6px, transparent 1.1px) 0 0 / 47px 31px,
          radial-gradient(circle, rgba(255,190,100,.8) 0 .7px, transparent 1.2px) 13px 17px / 71px 53px,
          radial-gradient(circle, rgba(255,220,150,.7) 0 .5px, transparent 1px) 29px 7px / 97px 79px;
        -webkit-mask-image:radial-gradient(ellipse var(--lit-w) var(--lit-h) at var(--sun-x) 50%, transparent 55%, #000 95%);
        mask-image:radial-gradient(ellipse var(--lit-w) var(--lit-h) at var(--sun-x) 50%, transparent 55%, #000 95%); }
      .splash-orbit { position:absolute; left:50%; top:50%; width:calc(var(--globe) * 1.32); height:calc(var(--globe) * .42); transform:translate(-50%, -50%) rotate(-18deg);
        border:1px solid rgba(190,215,255,.22); border-radius:50%; }
      /* A satellite on the orbit, where motion paths are supported (no stray dot otherwise). */
      @supports (offset-path: ellipse(50% 50% at 50% 50%)) {
        .splash-orbit:after { content:""; position:absolute; left:0; top:0; width:6px; height:6px; border-radius:50%; background:#fff; box-shadow:0 0 10px 2px rgba(170,210,255,.9);
          offset-path:ellipse(50% 50% at 50% 50%); offset-anchor:center; animation:splash-orbit 7s linear infinite; }
      }
      .splash-panel { position:absolute; left:50%; bottom:max(6vh, 28px); transform:translateX(-50%); width:min(360px, 84vw); display:flex; flex-direction:column; align-items:center; gap:10px;
        padding:16px 20px 14px; border-radius:16px; background:rgba(5,9,16,.62); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        transition:opacity .4s ease, transform .4s ease; }
      .splash-name { font-size:15px; letter-spacing:.32em; padding-left:.32em; }
      .splash-name b { font-weight:700; }
      .splash-tagline { font-size:12px; color:rgba(244,245,247,.66); text-align:center; line-height:1.4; }
      .splash-progress { position:relative; width:100%; height:3px; margin-top:4px; border-radius:2px; background:rgba(255,255,255,.1); overflow:hidden; }
      .splash-bar { position:absolute; inset:0 auto 0 0; width:var(--progress, 0%); border-radius:2px; background:linear-gradient(90deg, #5aa2ff, #8fe3ff); transition:width .5s ease; }
      /* While the engine downloads there is no measurable progress: a sweep, not a fake number. */
      #splash[data-stage="engine"] .splash-bar { width:28%; animation:splash-sweep 1.6s ease-in-out infinite; }
      .splash-caption { font-size:11px; letter-spacing:.06em; color:rgba(244,245,247,.55); font-variant-numeric:tabular-nums; }
      @keyframes splash-orbit { from { offset-distance:0%; } to { offset-distance:100%; } }
      @keyframes splash-sweep { from { left:-28%; } to { left:100%; } }
      @keyframes splash-in { to { opacity:1; } }
      /*
       * Intro (first visit only; the script below decides): an optional video
       * that rises from the ground to space and ends on the same view of the
       * globe, then a home page with an Enter button. It sits above the
       * loading screen, which carries on underneath, so entering is instant
       * once the engine is ready. Without the video the home page shows over
       * the loading screen's globe.
       */
      #intro { position:fixed; inset:0; z-index:110; overflow:hidden; color:#f4f5f7;
        font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        transition:opacity .8s ease; }
      #intro[hidden] { display:none; }
      #intro.leaving { opacity:0; pointer-events:none; }
      #intro-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#05070b; transition:transform .9s ease, opacity .7s ease; }
      #intro.no-video #intro-video { opacity:0; pointer-events:none; }
      #intro-skip { position:absolute; right:24px; bottom:24px; padding:8px 16px; border-radius:999px; border:1px solid rgba(255,255,255,.28); background:rgba(5,9,16,.5);
        color:#f4f5f7; font:inherit; font-size:12px; letter-spacing:.06em; cursor:pointer; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
      #intro-skip:hover { background:rgba(5,9,16,.75); }
      #intro.home #intro-skip { display:none; }
      .intro-home { position:absolute; left:50%; bottom:max(6vh, 28px); transform:translateX(-50%); width:min(380px, 86vw); display:flex; flex-direction:column; align-items:center; gap:12px;
        padding:20px 22px 18px; border-radius:18px; text-align:center; background:rgba(5,9,16,.62); border:1px solid rgba(255,255,255,.1);
        -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); opacity:0; visibility:hidden; transition:opacity .8s ease .15s, visibility 0s linear .95s; }
      #intro.home .intro-home { opacity:1; visibility:visible; transition:opacity .8s ease .15s; }
      .intro-name { margin:0; font-size:20px; font-weight:400; letter-spacing:.32em; padding-left:.32em; }
      .intro-name b { font-weight:700; }
      .intro-tagline { margin:0; font-size:13px; line-height:1.55; color:rgba(244,245,247,.74); }
      .intro-actions { display:flex; align-items:center; gap:14px; margin-top:4px; }
      #intro-enter { padding:10px 26px; border-radius:999px; border:0; background:#f4f5f7; color:#0b0c0f; font:inherit; font-size:14px; font-weight:600; letter-spacing:.04em; cursor:pointer; }
      #intro-enter:hover { background:#fff; }
      #intro-lang { padding:6px 4px; border:0; background:none; color:rgba(244,245,247,.7); font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
      /* Wide screens: the globe fills the middle, so the home page stands to its left. */
      @media (min-width:1100px) and (min-aspect-ratio:3/2) {
        .intro-home { left:max(4.5vw, 32px); bottom:auto; top:50%; transform:translateY(-50%); width:min(300px, 21vw); align-items:flex-start; text-align:left; padding:0;
          background:none; border:0; -webkit-backdrop-filter:none; backdrop-filter:none; gap:16px; }
        .intro-name { font-size:25px; }
        .intro-tagline { font-size:15px; }
      }
      /* While the intro is up, the loading panel stays out of its way. */
      #splash.with-intro .splash-panel { opacity:0; }
      /* A shared link opens elsewhere: keep a smaller globe that does not pretend to line up. */
      #splash.shared { --globe:min(36vmin, 320px); }
      @media (prefers-reduced-motion: reduce) {
        .splash-orbit:after, #splash[data-stage="engine"] .splash-bar { animation:none; }
        .splash-day { animation:none; opacity:1; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading TerraScope" data-stage="engine">
      <div class="splash-globe" aria-hidden="true"><div class="splash-day"></div><div class="splash-lights"></div></div>
      <div class="splash-orbit" aria-hidden="true"></div>
      <div class="splash-panel">
        <div class="splash-name">TERRA<b>SCOPE</b></div>
        <div class="splash-tagline">Real-time satellites, weather and geology on a 3D Earth</div>
        <div class="splash-progress" aria-hidden="true"><div class="splash-bar"></div></div>
        <div class="splash-caption">Loading the 3D engine…</div>
      </div>
    </div>
    <div id="intro" hidden>
      <video id="intro-video" muted playsinline preload="auto" aria-hidden="true"></video>
      <button id="intro-skip" type="button">Skip</button>
      <div class="intro-home">
        <h1 class="intro-name">TERRA<b>SCOPE</b></h1>
        <p class="intro-tagline" id="intro-tagline"></p>
        <div class="intro-actions"><button id="intro-enter" type="button">Enter</button><button id="intro-lang" type="button"></button></div>
      </div>
    </div>
    <script>
      // Intro: shown on a first visit (or with ?intro=1), never for shared
      // scenes or recording. A video on wide screens that allow motion and
      // data, then the home page; src/splash.ts holds the loading screen
      // until Enter. window.__terrascopeIntro tells the app what happened.
      (function () {
        var state = window.__terrascopeIntro = { active: false, entered: true, events: [] };
        var intro = document.getElementById("intro"), splash = document.getElementById("splash");
        if (!intro || !splash) return;
        var query = new URLSearchParams(location.search), store = null;
        try { store = window.localStorage; } catch (e) { /* storage blocked */ }
        var get = function (key) { try { return store ? store.getItem(key) : null; } catch (e) { return null; } };
        var set = function (key, value) { try { if (store) store.setItem(key, value); } catch (e) { /* storage blocked */ } };
        var forced = query.get("intro") === "1";
        if (query.has("record") || /(^|[#&])scene=/.test(location.hash) || (get("terrascope.intro") === "seen" && !forced)) return;

        var note = function (name) { state.events.push(name); window.dispatchEvent(new CustomEvent("terrascope:intro", { detail: name })); };
        var video = document.getElementById("intro-video"), skip = document.getElementById("intro-skip");
        var enter = document.getElementById("intro-enter"), langButton = document.getElementById("intro-lang");
        var TEXT = {
          en: { tagline: "Real-time satellites, weather, natural hazards and geology on a living 3D Earth.", enter: "Enter", skip: "Skip", other: "中文" },
          zh: { tagline: "在一颗实时运转的三维地球上，看卫星、天气、自然灾害与地质。", enter: "进入", skip: "跳过", other: "English" },
        };
        var lang = query.get("lang");
        if (lang !== "en" && lang !== "zh") lang = get("terrascope.language") === "zh" ? "zh" : "en";
        var paint = function () {
          document.getElementById("intro-tagline").textContent = TEXT[lang].tagline;
          enter.textContent = TEXT[lang].enter; skip.textContent = TEXT[lang].skip; langButton.textContent = TEXT[lang].other;
          intro.lang = lang === "zh" ? "zh-CN" : "en";
        };
        paint();
        langButton.onclick = function () {
          lang = lang === "zh" ? "en" : "zh";
          set("terrascope.language", lang);
          try { var url = new URL(location.href); url.searchParams.set("lang", lang); history.replaceState(history.state, "", url); } catch (e) { /* embedded browsers */ }
          paint();
          // The app follows if it has loaded; otherwise it reads the saved choice when it does.
          window.dispatchEvent(new CustomEvent("terrascope:locale", { detail: lang }));
        };

        state.active = true; state.entered = false;
        intro.hidden = false;
        splash.classList.add("with-intro");
        var home = false;
        var showHome = function (keepVideo) {
          if (home) return;
          home = true;
          if (!keepVideo) { intro.classList.add("no-video"); try { video.pause(); } catch (e) { /* not started */ } }
          intro.classList.add("home");
          enter.focus({ preventScroll: true });
        };
        enter.onclick = function () {
          if (state.entered) return;
          state.entered = true;
          set("terrascope.intro", "seen");
          note("enter");
          if (forced) try { var url = new URL(location.href); url.searchParams.delete("intro"); history.replaceState(history.state, "", url); } catch (e) { /* embedded browsers */ }
          // The video's last frame shows the globe at 49.1% of its width; shrink
          // it to the live globe's size (49.1% of the longer side) while fading.
          var w = innerWidth, h = innerHeight;
          video.style.transform = "scale(" + (Math.max(w, h) / Math.max(w, h * 16 / 9)).toFixed(4) + ")";
          intro.classList.add("leaving");
          splash.classList.remove("with-intro");
          window.dispatchEvent(new Event("terrascope:enter"));
          setTimeout(function () { intro.remove(); }, 950);
        };

        var motion = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
        var saver = navigator.connection && navigator.connection.saveData;
        if (innerWidth < 760 || innerHeight < 500 || !motion || saver) { note("home"); showHome(false); return; }
        note("video");
        video.poster = "/intro/poster.jpg";
        video.src = "/intro/intro.mp4";
        // No video (missing, blocked autoplay, slow start): straight to the home page.
        var started = false, watchdog = setTimeout(function () { if (!started) showHome(false); }, 5000);
        video.onplaying = function () { started = true; clearTimeout(watchdog); };
        video.onerror = function () { clearTimeout(watchdog); showHome(false); };
        video.onended = function () { note("watched"); showHome(true); };
        var playing = video.play();
        if (playing && playing.catch) playing.catch(function () { clearTimeout(watchdog); showHome(false); });
        skip.onclick = function () { clearTimeout(watchdog); note("skip"); showHome(false); };
        document.addEventListener("keydown", function (event) { if (event.key === "Escape" && !home) skip.onclick(); });
      })();
    </script>
    <script>
      // Light the loading globe from the real sun, as the 3D globe will be:
      // the default view looks straight down on 48°N 2°E with north up.
      (function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        if (/(^|[#&])scene=/.test(location.hash)) { splash.classList.add("shared"); return; }
        var rad = Math.PI / 180, now = new Date();
        var day = (Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) - Date.UTC(now.getUTCFullYear(), 0, 0)) / 864e5;
        var hours = now.getUTCHours() + now.getUTCMinutes() / 60;
        var dec = 23.44 * Math.sin(2 * Math.PI * (day - 81) / 365) * rad, sunLon = -15 * (hours - 12) * rad;
        var sun = [Math.cos(dec) * Math.cos(sunLon), Math.cos(dec) * Math.sin(sunLon), Math.sin(dec)];
        var lat = 48 * rad, lon = 2 * rad;
        var east = [-Math.sin(lon), Math.cos(lon), 0];
        var north = [-Math.sin(lat) * Math.cos(lon), -Math.sin(lat) * Math.sin(lon), Math.cos(lat)];
        var up = [Math.cos(lat) * Math.cos(lon), Math.cos(lat) * Math.sin(lon), Math.sin(lat)];
        var dot = function (a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; };
        var x = dot(sun, east), y = dot(sun, north), z = dot(sun, up), side = Math.hypot(x, y);
        // In the frame rotated towards the sun, the day side spans from the
        // sun's point (side) to the terminator (-z) along the sun's direction.
        var reach = Math.max(0.05, side + z);
        var s = splash.style;
        s.setProperty("--sun-angle", (-Math.atan2(y, x) / rad).toFixed(1) + "deg");
        s.setProperty("--sun-x", (50 + 50 * side).toFixed(1) + "%");
        s.setProperty("--lit-w", (100 * reach).toFixed(1) + "%");
        s.setProperty("--lit-h", (100 * Math.max(reach, Math.sqrt(Math.max(0, 1 - z * z)) + Math.max(0, z))).toFixed(1) + "%");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

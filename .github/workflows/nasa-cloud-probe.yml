name: NASA fallback IR layer probe
on:
  push:
    branches: [fix/cloud-imagery-loading-20261023]
    paths: [.github/workflows/nasa-cloud-probe.yml]
permissions:
  contents: read
jobs:
  nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect GIBS band13 near-real-time layer and example tiles
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,xml.etree.ElementTree as ET,datetime,concurrent.futures
          url='https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/wmts.cgi?SERVICE=WMTS&REQUEST=GetCapabilities'
          def load(url,timeout=14):
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Origin':'https://earth-atlas.edwardlab.workers.dev','User-Agent':'Earth-Atlas-probe'}),timeout=timeout) as f:
                b=f.read(20000000)
                print('GET',f.status,f.headers.get('Content-Type'),f.headers.get('Access-Control-Allow-Origin'),len(b),url,flush=True)
                return b
            except Exception as e:
              print('FAIL',repr(e),url,flush=True)
              return b''
          xml=load(url)
          if xml:
            root=ET.fromstring(xml)
            ns={'w':'http://www.opengis.net/wmts/1.0','o':'http://www.opengis.net/ows/1.1'}
            for p in root.findall('.//w:Layer',ns):
              ident=p.find('o:Identifier',ns)
              if ident is None or ident.text not in {'GOES-East_ABI_Band13_Clean_Infrared','GOES-West_ABI_Band13_Clean_Infrared','Himawari_AHI_Band13_Clean_Infrared'}:continue
              print('LAYER',ident.text,flush=True)
              for d in p.findall('w:Dimension',ns):
                print('DIMENSION',ET.tostring(d,encoding='unicode')[:1500],flush=True)
              for r in p.findall('w:ResourceURL',ns):print('RESOURCE',r.attrib,flush=True)
              for t in p.findall('w:TileMatrixSetLink',ns):print('MATRIX',ET.tostring(t,encoding='unicode')[:500],flush=True)
          now=datetime.datetime.now(datetime.timezone.utc)
          date=(now-datetime.timedelta(hours=4)).strftime('%Y-%m-%dT%H:00:00Z')
          tileurls=[]
          for product in ('GOES-East_ABI_Band13_Clean_Infrared','GOES-West_ABI_Band13_Clean_Infrared','Himawari_AHI_Band13_Clean_Infrared'):
            tileurls.append(f'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/{product}/default/{date}/GoogleMapsCompatible_Level9/2/1/1.png')
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            for b in pool.map(load,tileurls):
              if b:print('TILE_HEAD',b[:16].hex(),flush=True)
          PY

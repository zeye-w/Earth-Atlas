name: CI
# Light checks on every push and pull request: unit tests, types, build and
# static assets (about half a minute). The full browser suite is run by hand:
# see .github/workflows/e2e.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Macrostrat unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Diagnostic - locate actual Cesium runtime files
        run: find dist -type f | grep -E 'transferTypedArrayTest|approximateTerrainHeights|createVerticesFromHeightmap|createTaskProcessorWorker' || true
      - name: Verify Cesium static asset paths
        run: npm run verify:assets

name: internet-data
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internet-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
      INTERNET_DATA_PUBLICATION_APPROVED: ${{ vars.INTERNET_DATA_PUBLICATION_APPROVED }}
      INTERNET_DATA_PERMISSION_REFERENCE: ${{ vars.INTERNET_DATA_PERMISSION_REFERENCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production data on main (requires recorded permissions)
        if: github.ref == 'refs/heads/main'
        run: node --experimental-strip-types scripts/internet/build.mjs
      - name: Build unpublished research preview on a branch
        if: github.ref != 'refs/heads/main'
        run: node --experimental-strip-types scripts/internet/build.mjs --output-dir .cache/internet-preview
      - name: Validate all production or preview data
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            export INTERNET_DATA_TEST_DIR=.cache/internet-preview
          fi
          npm test
      - name: Commit changed data on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git add public/data/internet/*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: refresh internet datasets ($(date -u +%F))"
          git push origin HEAD:main

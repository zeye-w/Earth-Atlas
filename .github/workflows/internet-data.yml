name: internet-data
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internet-data-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build three open-licensed datasets
        run: node --experimental-strip-types scripts/internet/build.mjs
      - run: npm test
      - name: Commit changed data on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git add public/data/internet/*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: refresh internet datasets ($(date -u +%F))"
          git push origin HEAD:main

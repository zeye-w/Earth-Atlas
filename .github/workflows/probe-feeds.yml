# Temporary diagnostic: removed once the flight and DNS-flow failures are understood.
name: Probe flight and DNS feeds
on:
  push:
    branches: [claude/exciting-hypatia-1rt14s]
    paths: [".github/workflows/probe-feeds.yml", "scripts/probe-feeds.mjs"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-strip-types scripts/probe-feeds.mjs

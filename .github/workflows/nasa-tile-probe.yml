name: NASA cloud tiles valid grid probe
on:
  push:
    branches: [fix/cloud-imagery-loading-20261023]
    paths: [.github/workflows/nasa-tile-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check correct Level6 WMTS grid and freshest layer
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,concurrent.futures
          layers=['GOES-East_ABI_Band13_Clean_Infrared','GOES-West_ABI_Band13_Clean_Infrared','Himawari_AHI_Band13_Clean_Infrared']
          urls=[]
          for l in layers:
            for time in ('default','2026-10-23T00:30:00Z'):
              urls.append(f'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/{l}/default/{time}/GoogleMapsCompatible_Level6/0/0/0.png')
          def get(url):
            try:
              req=urllib.request.Request(url,headers={'Origin':'https://earth-atlas.edwardlab.workers.dev','User-Agent':'Earth-Atlas'})
              with urllib.request.urlopen(req,timeout=12) as r:
                b=r.read(1000000)
                return (r.status,len(b),b[:8].hex(),r.headers.get('access-control-allow-origin'),url)
            except Exception as e:return ('error',str(e)[:200],url)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
            for v in ex.map(get,urls):print('TILE_PROBE',v,flush=True)
          PY

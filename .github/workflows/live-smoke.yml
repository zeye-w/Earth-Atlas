name: Live Geology Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/smoke-live.mjs"
      - "src/geology.ts"
      - "src/auroraData.ts"
      - "src/earthquakeData.ts"
      - "src/geomagnetic.ts"
      - "src/trueColorData.ts"
      - "src/cloudData.ts"
      - "src/constellationData.ts"
      - "src/solarWindData.ts"
      - "src/flightData.ts"
      - "worker/**"
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Third-party services time out now and then (CelesTrak did on PR #17):
      # report it, but do not block a pull request on someone else's outage.
      - name: Check external Macrostrat API and production assets
        id: smoke
        continue-on-error: true
        run: node --experimental-strip-types scripts/smoke-live.mjs 2>&1 | tee smoke.log
      - name: Report an upstream failure without failing the check
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::warning title=Live smoke check failed::An external service or the production site did not answer as expected. Not blocking; see the log."
          { echo "### Live smoke check failed (not blocking)"; echo '```'; tail -n 40 smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

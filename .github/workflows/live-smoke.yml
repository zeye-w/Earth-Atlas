name: Live Geology Smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/smoke-live.mjs"
      - "src/geology.ts"
      - "src/auroraData.ts"
      - "src/earthquakeData.ts"
      - "src/geomagnetic.ts"
      - "src/trueColorData.ts"
      - "src/cloudData.ts"
      - "src/constellationData.ts"
      - "src/solarWindData.ts"
      - "src/flightData.ts"
      - "worker/**"
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check external Macrostrat API and production assets
        run: node --experimental-strip-types scripts/smoke-live.mjs

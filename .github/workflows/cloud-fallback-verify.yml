name: Verify IR cloud fallback
on:
  push:
    branches: [fix/cloud-imagery-loading-20261023]
    paths:
      - "src/cloudData.ts"
      - "src/layers/useClouds.ts"
      - "src/panels/EarthViewGroup.tsx"
      - "tests/cloudData.test.mjs"
      - "tests/e2e/cloud-fallback.spec.ts"
      - ".github/workflows/cloud-fallback-verify.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck all application code
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser test SSEC timeout to NASA infrared failover
        run: npx playwright test tests/e2e/cloud-fallback.spec.ts --reporter=list

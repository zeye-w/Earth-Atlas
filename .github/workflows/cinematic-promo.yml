name: Cinematic promo
# The 30 s TerraScope film (video/cinematic/README.md).
#   preview: stills every 0.8 s plus the ISS pass, for checking framing (no waiting).
#   full:    waits for the next sunlit ISS pass over a dark, busy region, snapshots the live
#            data, captures 900 frames in parallel chunks, grades, adds the HUD
#            and sound design, encodes 1080p30 H.264.
on:
  push:
    branches: [claude/exciting-hypatia-1rt14s]
    paths:
      - "video/cinematic/**"
      - ".github/workflows/cinematic-promo.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview or full"
        default: preview
      max_wait_min:
        description: "full mode: longest wait (minutes) for the next ISS window"
        default: "300"
      model_rotation:
        description: "ISS model axes correction, heading,pitch,roll in degrees"
        default: "90,0,90"
permissions:
  contents: write
concurrency:
  group: cinematic-${{ github.ref }}-${{ inputs.mode || 'preview' }}
  cancel-in-progress: true
env:
  MODE: ${{ inputs.mode || 'preview' }}
  ISS_MODEL: "https://raw.githubusercontent.com/nasa/NASA-3D-Resources/master/3D%20Models/International%20Space%20Station%20(ISS)%20(B)/International%20Space%20Station%20(ISS)%20(B).glb"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    outputs:
      chunks: ${{ steps.chunks.outputs.chunks }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Local site with the ISS model
        run: |
          mkdir -p dist/record-assets
          curl -fsSL "$ISS_MODEL" -o dist/record-assets/iss.glb
          python3 video/cinematic/trim_model.py dist/record-assets/iss.glb
          ls -l dist/record-assets
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
      - name: Find the window, wait for it (full), snapshot live data
        env:
          CINE_MODE: ${{ env.MODE }}
          CINE_MAX_WAIT_MIN: ${{ inputs.max_wait_min || '300' }}
          CINE_OUT: video/cinematic/out/plan
        run: node --experimental-strip-types video/cinematic/plan.mjs
      - id: chunks
        run: |
          if [ "$MODE" = full ]; then
            echo 'chunks=["0-74","75-149","150-215","216-305","306-395","396-485","486-575","576-650","651-725","726-800","801-899"]' >> "$GITHUB_OUTPUT"
          else
            echo 'chunks=["preview"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cine-plan
          path: video/cinematic/out/plan/
          retention-days: 7

  capture:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: true
      matrix:
        frames: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v7
        with:
          name: cine-plan
          path: video/cinematic/out/plan
      - name: Local site with the ISS model
        run: |
          mkdir -p dist/record-assets
          curl -fsSL "$ISS_MODEL" -o dist/record-assets/iss.glb
          python3 video/cinematic/trim_model.py dist/record-assets/iss.glb
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
      - name: Capture frames ${{ matrix.frames }}
        env:
          CINE_PLAN: video/cinematic/out/plan
          CINE_OUT: video/cinematic/out/frames
          CINE_FRAMES: ${{ matrix.frames }}
          CINE_MODEL_ROTATION: ${{ inputs.model_rotation || '90,0,90' }}
        run: node --experimental-strip-types video/cinematic/capture.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cine-frames-${{ matrix.frames }}
          path: video/cinematic/out/frames/
          retention-days: 7
          compression-level: 0

  render:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: FFmpeg and Python libraries
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user --break-system-packages Pillow numpy
      - uses: actions/download-artifact@v7
        with:
          name: cine-plan
          path: video/cinematic/out/plan
      - uses: actions/download-artifact@v7
        with:
          pattern: cine-frames-*
          merge-multiple: true
          path: video/cinematic/out/frames
      - name: Sound design
        run: python3 video/cinematic/sfx.py --plan video/cinematic/out/plan/plan.json --out video/cinematic/out/sfx.wav
      - name: Grade, HUD, encode
        run: |
          if [ "$MODE" = full ]; then
            python3 video/cinematic/render.py --frames video/cinematic/out/frames --plan video/cinematic/out/plan/plan.json --out video/cinematic/out/film --audio video/cinematic/out/sfx.wav
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,pix_fmt,color_space -of json video/cinematic/out/film/terrascope-cinematic-30s.mp4
          else
            python3 video/cinematic/render.py --frames video/cinematic/out/frames --plan video/cinematic/out/plan/plan.json --out video/cinematic/out/film --stills
          fi
          cp video/cinematic/out/plan/plan.json video/cinematic/out/sfx.wav video/cinematic/out/film/
          cp video/cinematic/out/frames/capture-*.json video/cinematic/out/film/
      - name: Review stills to the video/cinematic-review branch
        run: |
          mkdir -p /tmp/review
          for f in video/cinematic/out/film/*.jpg; do python3 -c "import sys; from PIL import Image; im=Image.open(sys.argv[1]); im.thumbnail((1280,720)); im.save(sys.argv[2], quality=84)" "$f" "/tmp/review/$(basename "$f")"; done
          cp video/cinematic/out/plan/plan.json /tmp/review/ 2>/dev/null || true
          cd /tmp/review
          git init -q -b video/cinematic-review
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Review stills: $MODE run ${{ github.run_id }} ($(date -u +%FT%TZ))"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:video/cinematic-review
      - uses: actions/upload-artifact@v7
        with:
          name: terrascope-cinematic-${{ env.MODE }}
          path: video/cinematic/out/film/
          retention-days: 14

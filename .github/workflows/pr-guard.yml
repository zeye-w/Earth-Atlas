name: PR guard
# Ownership rules for parallel work (docs/internet-layers.md): pull requests
# from codex/* branches may not change hotspot files (.github/hotspots.txt).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Hotspot files are left to the integrator
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          LABELS: ""
        run: node scripts/check-hotspots.mjs

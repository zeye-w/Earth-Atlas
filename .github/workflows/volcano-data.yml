name: Refresh Volcano Data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Download Smithsonian GVP Holocene volcano list
        run: node scripts/fetch-volcanoes.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- src/data/volcanoes.json)" ]; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/volcanoes.json
          git commit -m "data: refresh Smithsonian GVP Holocene volcano list"
          git push

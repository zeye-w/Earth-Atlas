name: README Screenshots
# Renders the README screenshots with live data and commits them to
# docs/screenshots/. Runs when the capture script changes, or manually.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/capture-screenshots.mjs
      - .github/workflows/screenshots.yml
permissions:
  contents: write
concurrency:
  group: readme-screenshots
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          node --experimental-strip-types scripts/capture-screenshots.mjs http://localhost:4173
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "docs: update README screenshots"
          git pull --rebase origin main
          git push origin HEAD:main

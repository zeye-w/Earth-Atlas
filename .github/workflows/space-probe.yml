name: Space probe
# Temporary: checks NASA JPL's close-approach and Horizons APIs.
on:
  push:
    branches: [claude/exciting-hypatia-1rt14s]
    paths: [".github/workflows/space-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close approaches (next 60 days, within 10 lunar distances)
        run: |
          curl -sS -D head -o cad.json -H "Origin: https://earth-atlas.edwardlab.workers.dev" "https://ssd-api.jpl.nasa.gov/cad.api?dist-max=10LD&date-min=now&date-max=%2B60&sort=dist&diameter=true&fullname=true"
          grep -iE '^(HTTP|content-type|access-control-allow-origin)' head
          python3 -c "import json;d=json.load(open('cad.json'));print(d['fields']);print(d['count']);[print(r) for r in d['data'][:8]]"
      - name: Horizons vectors for an asteroid (geocentric, ICRF) and spacecraft
        run: |
          des=$(python3 -c "import json;print(json.load(open('cad.json'))['data'][0][0])")
          echo "asteroid $des"
          q() { curl -sS -G "https://ssd.jpl.nasa.gov/api/horizons.api" --data-urlencode "format=json" --data-urlencode "COMMAND=$1" --data-urlencode "EPHEM_TYPE=VECTORS" --data-urlencode "CENTER=$2" --data-urlencode "REF_PLANE=FRAME" --data-urlencode "VEC_TABLE=1" --data-urlencode "OUT_UNITS=KM-S" --data-urlencode "START_TIME=$3" --data-urlencode "STOP_TIME=$4" --data-urlencode "STEP_SIZE=$5" -D h2 | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('result','');i=r.find('\$\$SOE');print(r[i:i+600] if i>=0 else r[:1500])"; grep -iE '^(HTTP|access-control-allow-origin)' h2; }
          now=$(date -u +%Y-%m-%d); later=$(date -u -d '+1 day' +%Y-%m-%d)
          q "DES=$des;" "500@399" "$now" "$later" "12h"
          for sc in -170 -31 -32 -98 -96 -21 -159; do echo "== spacecraft $sc"; q "$sc" "500@399" "$now" "$later" "1d"; done

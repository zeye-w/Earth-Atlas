name: E2E
# The full Playwright suite (all external services mocked), run by hand:
# Actions → E2E → Run workflow, choosing the branch to test. It no longer runs
# on every push or pull request (about 10 runner-minutes × 4 shards each time).
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Only tests whose title matches this (Playwright --grep); empty runs everything"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      # The runner image already has Chromium's system libraries; --with-deps only
      # added fonts through apt, which has stalled for minutes. Tests launch the
      # headless shell, so cache just that per Playwright version.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-headless-shell
      - name: Install Chromium for Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - name: Check Chromium starts (install system libraries only if missing)
        run: |
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close())" \
            || npx playwright install-deps chromium
      - name: End-to-end tests (all external services mocked)
        env:
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then npm run test:e2e -- --shard=${{ matrix.shard }}/4 --grep "$GREP" --pass-with-no-tests
          else npm run test:e2e -- --shard=${{ matrix.shard }}/4; fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # One check name ("e2e") for all shards.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: All e2e shards passed
        run: test "${{ needs.e2e-shard.result }}" = "success"

name: Vector Tile Diagnostic
on:
  pull_request:
    paths:
      - "scripts/inspect-vector-tiles.mjs"
      - ".github/workflows/vector-diagnostics.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/inspect-vector-tiles.mjs
